# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.13
default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  # Using this mirror lets us use mypyc-compiled black, which is about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.9.0
    hooks:
      - id: black
        # It is recommended to specify the latest version of Python
        # supported by your project here, or alternatively use
        # pre-commit's default_language_version, see
        # https://pre-commit.com/#top_level-default_language_version
        language_version: python3.13
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
        require_serial: true
      - id: end-of-file-fixer
        require_serial: true
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  # Match the CI lint gate and autofix staged import ordering before commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]

  # Re-lock when pyproject.toml (or the lock itself) is staged so CI --locked never drifts.
  - repo: local
    hooks:
      - id: uv-lock
        name: sync uv.lock with pyproject.toml
        entry: uv lock
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        require_serial: true
      - id: verify-before-push
        name: run the CI-equivalent verification gate
        entry: uv run python dev/verify.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
